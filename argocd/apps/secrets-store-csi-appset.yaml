apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: secrets-store-csi
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - { key: env, operator: Exists }
  template:
    metadata:
      name: "secrets-store-csi-{{.metadata.labels.env}}"
    spec:
      project: default
      source:
        repoURL: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
        chart: secrets-store-csi-driver
        targetRevision: 1.4.6
        helm:
          values: |
            syncSecret:
              enabled: true
            enableSecretRotation: true
      destination:
        server: "{{.server}}"
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

