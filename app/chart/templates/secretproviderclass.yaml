apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.serviceAccount.name }}-secrets
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.project | default "PROJECT" }}/secrets/{{ .Values.secrets.dbPasswordSecret }}/versions/latest"
        path: "db-password"
